spring.application.name=expenseTracker
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.port=${SERVER_PORT:8082}

app.jwt.secret=${JWT_SECRET:development-only-secret-change-before-production-32-bytes-minimum}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

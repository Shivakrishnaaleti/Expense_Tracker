services:
  app:
    build: .
    environment:
      DB_URL: ${DOCKER_DB_URL:-jdbc:mysql://host.docker.internal:3306/expense_tracker}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
      SERVER_PORT: 8082
    ports:
      - "${DOCKER_HOST_PORT:-8083}:8082"
